<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg" sizes="32x32" href="/files/favicon/favicon-32.svg" />
    <link rel="icon" type="image/svg" sizes="16x16" href="/files/favicon/favicon-16.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fdfdf8" />
    <script>
      (function() {
        var t = localStorage.getItem('theme');
        var d = t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        if (d) document.documentElement.classList.add('dark');
        document.documentElement.style.colorScheme = d ? 'dark' : 'light';
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute('content', d ? '#0e0e0e' : '#fdfdf8');
      })();
    </script>
    <link
      rel="preload"
      href="/files/font/Inter-VariableFont_opsz,wght.ttf"
      as="font"
      type="font/ttf"
      crossorigin
    />
